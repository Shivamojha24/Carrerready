<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Applications | CareerReady</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>
        /* =========================================================
           PAGE
        ========================================================= */

        body {
            margin: 0;
            background: #f5f7fb;
            color: #1f2937;
            font-family: Arial, Helvetica, sans-serif;
        }

        .applications-page {
            width: 100%;
            min-height: 100vh;
            box-sizing: border-box;
            padding: 35px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 30px;
        }

        .page-header h1 {
            margin: 0 0 8px;
            font-size: 30px;
            color: #111827;
        }

        .page-header p {
            margin: 0;
            color: #6b7280;
            font-size: 15px;
        }

        .header-badge {
            background: #eaf2ff;
            color: #2563eb;
            border: 1px solid #cfe0ff;
            padding: 9px 15px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
        }


        /* =========================================================
           SUMMARY
        ========================================================= */

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 28px;
        }

        .summary-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 3px 12px rgba(15, 23, 42, 0.05);
        }

        .summary-label {
            color: #6b7280;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .summary-value {
            color: #111827;
            font-size: 26px;
            font-weight: 700;
        }


        /* =========================================================
           FILTER
        ========================================================= */

        .filter-bar {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 16px 18px;
            margin-bottom: 25px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
        }

        .filter-left {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-button {
            border: 1px solid #d1d5db;
            background: #ffffff;
            color: #4b5563;
            padding: 9px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .filter-button:hover {
            border-color: #2563eb;
            color: #2563eb;
        }

        .filter-button.active {
            background: #2563eb;
            color: #ffffff;
            border-color: #2563eb;
        }

        .refresh-button {
            border: none;
            background: #111827;
            color: #ffffff;
            padding: 9px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }


        /* =========================================================
           APPLICATION CARDS
        ========================================================= */

        .applications-list {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
        }

        .application-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 22px;
            box-shadow: 0 4px 15px rgba(15, 23, 42, 0.05);
        }

        .application-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 18px;
        }

        .company-name {
            margin: 0 0 6px;
            font-size: 18px;
            color: #111827;
        }

        .drive-title {
            margin: 0;
            color: #6b7280;
            font-size: 13px;
        }

        .role-title {
            margin: 0 0 15px;
            color: #2563eb;
            font-size: 16px;
            font-weight: 700;
        }


        /* =========================================================
           STATUS
        ========================================================= */

        .status-badge {
            padding: 7px 11px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            white-space: nowrap;
        }

        .status-REGISTERED {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .status-SHORTLISTED {
            background: #dcfce7;
            color: #166534;
        }

        .status-ASSESSMENT {
            background: #fef3c7;
            color: #92400e;
        }

        .status-INTERVIEW {
            background: #ede9fe;
            color: #6d28d9;
        }

        .status-SELECTED {
            background: #dcfce7;
            color: #166534;
        }

        .status-REJECTED {
            background: #fee2e2;
            color: #991b1b;
        }


        /* =========================================================
           APPLICATION DETAILS
        ========================================================= */

        .details-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .detail-item {
            background: #f8fafc;
            border-radius: 8px;
            padding: 11px;
        }

        .detail-label {
            display: block;
            color: #9ca3af;
            font-size: 11px;
            margin-bottom: 4px;
        }

        .detail-value {
            color: #374151;
            font-size: 12px;
            font-weight: 600;
        }


        /* =========================================================
           STATE
        ========================================================= */

        .state-box {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 45px 20px;
            text-align: center;
            color: #6b7280;
        }

        .state-box h3 {
            margin: 0 0 8px;
            color: #374151;
            font-size: 17px;
        }

        .state-box p {
            margin: 0;
            font-size: 13px;
        }

        .error-box {
            border-color: #fecaca;
            background: #fff7f7;
        }

        .error-box h3 {
            color: #991b1b;
        }


        /* =========================================================
           RESPONSIVE
        ========================================================= */

        @media (max-width: 900px) {
            .applications-list {
                grid-template-columns: 1fr;
            }

            .summary-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 600px) {
            .applications-page {
                padding: 20px 15px;
            }

            .page-header {
                flex-direction: column;
            }

            .details-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <main class="applications-page">

        <!-- =====================================================
             HEADER
        ====================================================== -->

        <section class="page-header">

            <div>

                <h1>My Applications</h1>

                <p>
                    Track your placement applications and
                    recruitment progress.
                </p>

            </div>

            <div class="header-badge">
                CareerReady
            </div>

        </section>


        <!-- =====================================================
             SUMMARY
        ====================================================== -->

        <section class="summary-grid">

            <div class="summary-card">

                <div class="summary-label">
                    Total Applications
                </div>

                <div
                    class="summary-value"
                    id="totalApplications"
                >
                    0
                </div>

            </div>


            <div class="summary-card">

                <div class="summary-label">
                    Active Applications
                </div>

                <div
                    class="summary-value"
                    id="activeApplications"
                >
                    0
                </div>

            </div>


            <div class="summary-card">

                <div class="summary-label">
                    Selected
                </div>

                <div
                    class="summary-value"
                    id="selectedApplications"
                >
                    0
                </div>

            </div>

        </section>


        <!-- =====================================================
             FILTER
        ====================================================== -->

        <section class="filter-bar">

            <div class="filter-left">

                <button
                    type="button"
                    class="filter-button active"
                    data-filter="ALL"
                >
                    All
                </button>

                <button
                    type="button"
                    class="filter-button"
                    data-filter="REGISTERED"
                >
                    Registered
                </button>

                <button
                    type="button"
                    class="filter-button"
                    data-filter="INTERVIEW"
                >
                    Interview
                </button>

                <button
                    type="button"
                    class="filter-button"
                    data-filter="SELECTED"
                >
                    Selected
                </button>

            </div>

            <button
                type="button"
                class="refresh-button"
                id="refreshButton"
            >
                Refresh
            </button>

        </section>


        <!-- =====================================================
             APPLICATION CONTENT
        ====================================================== -->

        <section id="contentArea">

            <div class="state-box">

                <h3>
                    Loading applications...
                </h3>

                <p>
                    Please wait while we load your applications.
                </p>

            </div>

        </section>

    </main>


    <script src="../js/api.js"></script>
    <script src="../js/studentApplications.js"></script>

</body>
</html>
