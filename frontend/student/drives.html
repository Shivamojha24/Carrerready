<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Placement Drives | CareerReady</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>
        /* =========================================================
           PAGE LAYOUT
        ========================================================= */

        body {
            margin: 0;
            background: #f5f7fb;
            color: #1f2937;
            font-family: Arial, Helvetica, sans-serif;
        }

        .drives-page {
            width: 100%;
            min-height: 100vh;
            box-sizing: border-box;
            padding: 35px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 30px;
        }

        .page-header h1 {
            margin: 0 0 8px;
            font-size: 30px;
            color: #111827;
        }

        .page-header p {
            margin: 0;
            color: #6b7280;
            font-size: 15px;
        }

        .header-badge {
            background: #eaf2ff;
            color: #2563eb;
            border: 1px solid #cfe0ff;
            padding: 9px 15px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
        }


        /* =========================================================
           SUMMARY
        ========================================================= */

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 28px;
        }

        .summary-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 3px 12px rgba(15, 23, 42, 0.05);
        }

        .summary-label {
            color: #6b7280;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .summary-value {
            color: #111827;
            font-size: 26px;
            font-weight: 700;
        }


        /* =========================================================
           FILTER BAR
        ========================================================= */

        .filter-bar {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 16px 18px;
            margin-bottom: 25px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
        }

        .filter-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-button {
            border: 1px solid #d1d5db;
            background: #ffffff;
            color: #4b5563;
            padding: 9px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .filter-button:hover {
            border-color: #2563eb;
            color: #2563eb;
        }

        .filter-button.active {
            background: #2563eb;
            color: #ffffff;
            border-color: #2563eb;
        }

        .refresh-button {
            border: none;
            background: #111827;
            color: #ffffff;
            padding: 9px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .refresh-button:hover {
            background: #1f2937;
        }


        /* =========================================================
           DRIVE GRID
        ========================================================= */

        .drives-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 22px;
        }

        .drive-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(15, 23, 42, 0.05);
        }

        .drive-card-header {
            padding: 22px;
            border-bottom: 1px solid #eef0f4;
        }

        .company-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 15px;
        }

        .company-name {
            margin: 0 0 6px;
            font-size: 18px;
            color: #111827;
        }

        .drive-title {
            margin: 0;
            color: #4b5563;
            font-size: 14px;
            line-height: 1.5;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
        }

        .status-open {
            background: #dcfce7;
            color: #166534;
        }

        .status-upcoming {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .drive-description {
            margin: 15px 0 0;
            color: #6b7280;
            font-size: 13px;
            line-height: 1.6;
        }

        .drive-meta {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 18px;
        }

        .meta-item {
            background: #f8fafc;
            border-radius: 8px;
            padding: 11px;
        }

        .meta-label {
            display: block;
            color: #9ca3af;
            font-size: 11px;
            margin-bottom: 4px;
        }

        .meta-value {
            color: #374151;
            font-size: 12px;
            font-weight: 600;
        }


        /* =========================================================
           ROLES
        ========================================================= */

        .roles-section {
            padding: 20px 22px 22px;
        }

        .roles-heading {
            margin: 0 0 14px;
            font-size: 14px;
            color: #111827;
        }

        .role-card {
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 12px;
            background: #ffffff;
        }

        .role-card:last-child {
            margin-bottom: 0;
        }

        .role-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 12px;
        }

        .role-title {
            margin: 0;
            font-size: 15px;
            color: #111827;
        }

        .eligibility-badge {
            padding: 5px 9px;
            border-radius: 15px;
            font-size: 10px;
            font-weight: 700;
            white-space: nowrap;
        }

        .eligible {
            background: #dcfce7;
            color: #166534;
        }

        .not-eligible {
            background: #fee2e2;
            color: #991b1b;
        }

        .match-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 7px;
        }

        .match-label {
            color: #6b7280;
            font-size: 12px;
        }

        .match-value {
            color: #2563eb;
            font-size: 13px;
            font-weight: 700;
        }

        .progress-track {
            width: 100%;
            height: 7px;
            background: #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #2563eb;
            border-radius: 10px;
        }

        .role-info {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-top: 14px;
        }

        .skill-tag {
            display: inline-flex;
            padding: 5px 8px;
            border-radius: 6px;
            background: #f3f4f6;
            color: #4b5563;
            font-size: 10px;
            font-weight: 600;
        }

        .skill-tag.matched {
            background: #dcfce7;
            color: #166534;
        }

        .skill-tag.missing {
            background: #fee2e2;
            color: #991b1b;
        }

        .skills-label {
            width: 100%;
            color: #9ca3af;
            font-size: 10px;
            margin-top: 4px;
        }

        .cgpa-info {
            margin-top: 12px;
            color: #6b7280;
            font-size: 11px;
        }


        /* =========================================================
           LOADING / ERROR / EMPTY
        ========================================================= */

        .state-box {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 45px 20px;
            text-align: center;
            color: #6b7280;
        }

        .state-box h3 {
            margin: 0 0 8px;
            color: #374151;
            font-size: 17px;
        }

        .state-box p {
            margin: 0;
            font-size: 13px;
        }

        .error-box {
            border-color: #fecaca;
            background: #fff7f7;
        }

        .error-box h3 {
            color: #991b1b;
        }


        /* =========================================================
           RESPONSIVE
        ========================================================= */

        @media (max-width: 900px) {
            .drives-grid {
                grid-template-columns: 1fr;
            }

            .summary-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 600px) {
            .drives-page {
                padding: 20px 15px;
            }

            .page-header {
                flex-direction: column;
            }

            .drive-meta {
                grid-template-columns: 1fr;
            }

            .company-row {
                flex-direction: column;
            }
        }
        .apply-button {
    width: 100%;
    margin-top: 16px;
    padding: 11px 16px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: #ffffff;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
}

.apply-button:hover {
    background: #1d4ed8;
}

.apply-button:disabled {
    cursor: not-allowed;
    opacity: 0.7;
}

.apply-button.disabled {
    background: #e5e7eb;
    color: #6b7280;
    cursor: not-allowed;
}

.apply-button.applied {
    background: #16a34a;
}
    </style>
</head>

<body>

    <main class="drives-page">

        <!-- =====================================================
             PAGE HEADER
        ====================================================== -->

        <section class="page-header">

            <div>
                <h1>Placement Drives</h1>

                <p>
                    Explore active recruitment opportunities and check
                    your eligibility and skill match.
                </p>
            </div>

            <div class="header-badge">
                CareerReady
            </div>

        </section>


        <!-- =====================================================
             SUMMARY CARDS
        ====================================================== -->

        <section class="summary-grid">

            <div class="summary-card">
                <div class="summary-label">
                    Available Drives
                </div>

                <div
                    class="summary-value"
                    id="totalDrives"
                >
                    0
                </div>
            </div>


            <div class="summary-card">
                <div class="summary-label">
                    Eligible Roles
                </div>

                <div
                    class="summary-value"
                    id="eligibleRoles"
                >
                    0
                </div>
            </div>


            <div class="summary-card">
                <div class="summary-label">
                    Average Skill Match
                </div>

                <div
                    class="summary-value"
                    id="averageMatch"
                >
                    0%
                </div>
            </div>

        </section>


        <!-- =====================================================
             FILTER BAR
        ====================================================== -->

        <section class="filter-bar">

            <div class="filter-left">

                <button
                    type="button"
                    class="filter-button active"
                    data-filter="ALL"
                >
                    All Drives
                </button>

                <button
                    type="button"
                    class="filter-button"
                    data-filter="ELIGIBLE"
                >
                    Eligible Roles
                </button>

                <button
                    type="button"
                    class="filter-button"
                    data-filter="HIGH_MATCH"
                >
                    High Match
                </button>

            </div>

            <button
                type="button"
                class="refresh-button"
                id="refreshButton"
            >
                Refresh
            </button>

        </section>


        <!-- =====================================================
             CONTENT
        ====================================================== -->

        <section id="contentArea">

            <div class="state-box">

                <h3>Loading placement drives...</h3>

                <p>
                    Please wait while we load the latest opportunities.
                </p>

            </div>

        </section>

    </main>


    <!-- =========================================================
         SCRIPTS
    ========================================================== -->

    <script src="../js/api.js"></script>
    <script src="../js/studentDrives.js"></script>

</body>
</html>
